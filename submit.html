
<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#7157c8">

  <title>Kirim Ulasan — Kelaor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <script src="js/submit.js" defer></script>
</head>

<body class="form-page">
  <header class="site-header">
    <a class="brand" href="index.html">kelaor<span>.</span></a>
    <a class="back-link" href="index.html">← Kembali ke ulasan</a>
  </header>

  <main class="form-shell">
    <div class="form-intro">
      <p class="eyebrow">CUSTOMER FEEDBACK</p>
      <h1>Ceritakan pengalamanmu.</h1>
      <p>Ulasan yang jujur membantu kami memahami pengalaman pelanggan dan membantu calon pelanggan lainnya.</p>
    </div>

    <form class="review-form" id="review-form">
      <div class="form-demo-alert" id="token-status">
        Memeriksa tautan ulasan...
      </div>

      <div class="field">
        <label for="customer-name">Nama pelanggan</label>
        <input
          id="customer-name"
          name="customerName"
          placeholder="Memuat nama pelanggan..."
          readonly
          required
        >
      </div>

      <div class="field">
        <label for="product-name">Produk yang dibeli</label>
        <input
          id="product-name"
          name="productName"
          placeholder="Memuat nama produk..."
          readonly
          required
        >
      </div>

      <fieldset class="rating-field">
        <legend>Bagaimana pengalaman transaksimu?</legend>

        <div class="star-picker" role="radiogroup" aria-label="Pilih rating">
          <input type="radio" id="star-5" name="rating" value="5">
          <label for="star-5" title="5 bintang">★</label>

          <input type="radio" id="star-4" name="rating" value="4">
          <label for="star-4" title="4 bintang">★</label>

          <input type="radio" id="star-3" name="rating" value="3">
          <label for="star-3" title="3 bintang">★</label>

          <input type="radio" id="star-2" name="rating" value="2">
          <label for="star-2" title="2 bintang">★</label>

          <input type="radio" id="star-1" name="rating" value="1">
          <label for="star-1" title="1 bintang">★</label>
        </div>

        <span class="field-hint" id="rating-hint">
          Pilih 1 sampai 5 bintang.
        </span>
      </fieldset>

      <div class="field">
        <label for="review-comment">Ulasan</label>
        <textarea
          id="review-comment"
          name="comment"
          rows="5"
          placeholder="Ceritakan pengalamanmu saat bertransaksi..."
          required
          minlength="10"
          maxlength="500"
        ></textarea>
        <span class="field-hint">10–500 karakter.</span>
      </div>

      <label class="consent">
        <input type="checkbox" id="review-consent" required>
        <span>
          Saya setuju nama, produk, rating, dan komentar saya ditampilkan pada halaman ulasan Kelaor.
        </span>
      </label>

      <button
        class="button button-primary button-full"
        id="submit-button"
        type="submit"
        disabled
      >
        Kirim ulasan <span aria-hidden="true">↗</span>
      </button>

      <p class="form-feedback" id="form-feedback" role="status"></p>
    </form>
  </main>

  <footer class="site-footer page-wrap">
    <a class="brand" href="index.html">kelaor<span>.</span></a>
    <span>© <span id="year"></span> Kelaor</span>
    <script src="js/submit.js" defer></script>
  </footer>
</body>
</html>
